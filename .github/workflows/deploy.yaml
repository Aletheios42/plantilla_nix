name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      image:
        required: true
        type: string
      target:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Deploy with kluctl
        run: |
          nix develop .#ci --command kluctl deploy \
            -t "${{ inputs.target }}" \
            --fixed-image="${{ inputs.image }}:${{ inputs.tag }}" \
            -y
